test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# DigitalOcean Spaces, used in production. Spaces is S3-compatible, so this uses
# Active Storage's stock S3 service with a regional endpoint.
#
# `public: true` makes uploads world-readable and produces permanent, unsigned
# URLs straight from the bucket — right for a blog, where the images are public
# anyway, and far more cacheable than expiring signed URLs.
#
# Set these with `bin/rails credentials:edit` (see README).
digitalocean:
  service: S3
  access_key_id:     <%= Rails.application.credentials.dig(:digitalocean, :access_key_id) %>
  secret_access_key: <%= Rails.application.credentials.dig(:digitalocean, :secret_access_key) %>
  region:            <%= Rails.application.credentials.dig(:digitalocean, :region) %>
  bucket:            <%= Rails.application.credentials.dig(:digitalocean, :bucket) %>
  endpoint:          https://<%= Rails.application.credentials.dig(:digitalocean, :region) %>.digitaloceanspaces.com
  public: true
